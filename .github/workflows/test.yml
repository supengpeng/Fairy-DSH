name: candidate-tests

on:
  push:
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            profiles/web/pnpm-lock.yaml
      # One root workspace install: every linked plugin resolves its own
      # dependencies from its real directory, which only the repo root
      # node_modules can satisfy.
      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install profile dependencies
        working-directory: profiles/web
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test visual
        working-directory: fairy-visual/dsh-fairy-visual
        run: pnpm test
      - name: Test voice
        working-directory: fairy-voice/dsh-fairy-voice
        run: pnpm test
